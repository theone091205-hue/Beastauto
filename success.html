<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success – BeastAuto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0A0D14;
            color: #fff;
            font-family: "Inter", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #0F141F;
            padding: 40px;
            width: 380px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #63A1FF, #B16BFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% {transform: scale(0.5); opacity: 0;}
            100% {transform: scale(1); opacity: 1;}
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #4F8CFF, #AA66FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            opacity: 0.75;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(90deg, #4F8CFF, #AA66FF);
            font-weight: 600;
            box-shadow: 0px 4px 18px rgba(120, 80, 255, 0.45);
            transition: 0.25s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 24px rgba(140, 90, 255, 0.55);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">✔</div>
        <h1>Success!</h1>
        <div class="desc">
            Your TikTok account is now connected and ready to use.
        </div>

        <a href="/dashboard" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>

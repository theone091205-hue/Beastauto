<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BeastAuto – TikTok Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0A0D14; /* Deep dark navy */
            color: rgba(255, 255, 255, 0.88);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.4em;
            font-weight: 700;
            color: #FFFFFF;
        }

        .subtext {
            margin-top: 8px;
            font-size: 1.05em;
            opacity: 0.7;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 25px;
            gap: 28px;
        }

        .card {
            width: 360px;
            padding: 22px;
            background: #0F141F;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0px 6px 25px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.35em;
            color: #FFFFFF;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .value {
            font-size: 1em;
            margin: 7px 0;
            opacity: 0.82;
        }

        .json-block {
            font-size: 0.88em;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
            height: 220px;
            line-height: 1.45em;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(90deg, #4F8CFF, #AA66FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1 class="gradient-text">TikTok Dashboard</h1>
        <div class="subtext">Your connected TikTok account activity</div>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="card"><h2>Loading...</h2></div>
    </div>

    <script>
        async function loadData() {
            const API_BASE = "https://untriggered-vicenary-lincoln.ngrok-free.dev";

            let res;

            try {
                res = await fetch(API_BASE + "/api/tiktok/dashboard", {
                    method: "GET",
                    credentials: "include"   // REQUIRED
                });
            } catch (err) {
                document.getElementById("dashboard").innerHTML = `
                    <div class="card"><h2>Backend unreachable</h2></div>
                `;
                return;
            }

            if (res.status === 401) {
                // Not authenticated
                window.location.href = "https://beastauto.shop/tiktok/error";
                return;
            }

            const data = await res.json();

            const container = document.getElementById("dashboard");

            container.innerHTML = `
                <div class="card">
                    <h2>User Info</h2>
                    ${data.user_info?.data ? `
                        <div class="value"><strong>Name:</strong> ${data.user_info.data.display_name}</div>
                        <div class="value"><strong>Followers:</strong> ${data.user_info.data.follower_count}</div>
                        <div class="value"><strong>Likes:</strong> ${data.user_info.data.likes_count}</div>
                        <div class="value"><strong>Videos:</strong> ${data.user_info.data.video_count}</div>
                    ` : `<div class="value">Failed to load user info.</div>`}
                </div>

                <div class="card">
                    <h2>Video List</h2>
                    <div class="json-block">${JSON.stringify(data.video_list, null, 2)}</div>
                </div>

                <div class="card">
                    <h2>Upload Result</h2>
                    <div class="json-block">${JSON.stringify(data.upload_result, null, 2)}</div>
                </div>
            `;
        }

        loadData();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login with TikTok – BeastAuto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0D14;
            color: rgba(255, 255, 255, 0.9);
            font-family: "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 35px;
            background: #0F141F;
            border-radius: 20px;
            width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0px 8px 26px rgba(0, 0, 0, 0.45);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(90deg, #4F8CFF, #AA66FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            margin-top: 12px;
            font-size: 0.98em;
            opacity: 0.7;
        }

        .login-btn {
            margin-top: 28px;
            display: inline-block;
            padding: 14px 18px;
            font-size: 1.05em;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(90deg, #4F8CFF, #AA66FF);
            box-shadow: 0px 4px 20px rgba(77, 97, 255, 0.45);
            transition: 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 24px rgba(130, 80, 255, 0.55);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.85em;
            opacity: 0.55;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BeastAuto Login</h1>
        <div class="sub">Connect your TikTok account securely</div>

        <a class="login-btn" href="/api/tiktok/auth">
            Login with TikTok
        </a>

        <div class="footer">
            Powered by Beast AI Marketing
        </div>
    </div>

</body>
</html>
